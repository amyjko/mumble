# CI is the deploy gate (AR-DEPLOY-2). With no staging environment
# (AR-TEST-10), a red suite blocking main is the only thing between a bad
# commit and users — which is also why the AR-DEPLOY-3 budget check lives here
# rather than in a dashboard nobody reads.
#
# Until this existed, UX-A11Y-1's "axe scans in CI (both themes)" and its
# computed-contrast and compiler-warning clauses were conventions run by hand.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm before Node, so setup-node's pnpm cache has something to key on.
      # pnpm/action-setup rather than Corepack: Corepack was unbundled from
      # Node 25, and STACK.md §3 records that pnpm 10 cannot bootstrap pnpm 11
      # via the packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # SvelteKit generates the types for `$env/static/public` from the
      # variables that actually exist, so without a .env every consumer of
      # PUBLIC_SUPABASE_* is untyped and lint fails there. These are publishable
      # values shipped to the browser, not secrets (AR-DEPLOY-6) — placeholders
      # are enough, since nothing in the suite talks to a real Supabase.
      - name: Provide public env for type generation
        run: cp .env.example .env

      # MUST precede lint. tsconfig.json extends .svelte-kit/tsconfig.json,
      # which is GENERATED — without it every type resolves to `any` and the
      # no-unsafe-* rules fire on the entire codebase (1923 errors, reproduced
      # locally by deleting .svelte-kit). The `prepare` hook does run this on
      # install, but it ends in `|| echo ''` and so swallows its own failure;
      # relying on a step that cannot report failing is how this stayed
      # invisible until CI existed.
      - name: Generate framework types
        run: |
          pnpm exec svelte-kit sync
          pnpm exec wrangler types

      # Ordered cheapest-first (TESTING.md §12) so the fastest signal fails
      # first: seconds of linting before minutes of browsers.
      - name: Lint (the TypeScript norms gate)
        run: pnpm lint

      - name: Typecheck (TypeScript 7)
        run: pnpm run check:ts

      # a11y warnings are FAILURES here (--fail-on-warnings), which is one of
      # UX-A11Y-1's three mechanical clauses.
      - name: Svelte check
        run: pnpm run check:svelte

      # MUST precede the vitest step, not just the e2e one: the `client` Vitest
      # project runs component tests in real Chromium via the Playwright
      # provider (AR-TEST-3). With the install after it, those 9 tests silently
      # did not run and CI reported 251 passing where local reports 260 — a
      # green suite that was quietly smaller than it looked. Still needed here
      # after E2E moved to the database job: the `client` vitest project runs
      # component tests in real Chromium.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The client and server projects ONLY. `integration` needs a running
      # Supabase and lives in the database job — naming the projects here rather
      # than excluding one means adding a project cannot silently join the fast
      # lane and start requiring Docker of it.
      - name: Unit and component tests
        run: pnpm exec vitest --run --project client --project server

      # The TURN relay is the only thing this product spends money on, and until
      # 2026-07-20 nothing had ever exercised it: every media test runs on
      # loopback, where a direct path always wins, so the relay code never ran
      # and `relayed` only ever reported false. `iceTransportPolicy: 'relay'`
      # forces it — but needs something to relay through.
      #
      # apt rather than a container: on macOS neither Docker published ports nor
      # host networking reaches a browser on the host, so a developer runs the
      # binary natively. Running it the same way here means CI exercises the
      # path someone can actually debug, instead of a second configuration that
      # only exists in CI.
      - name: Install coturn (the relay under test)
        run: sudo apt-get update && sudo apt-get install -y coturn

      - name: Start coturn
        run: pnpm run coturn

      - name: Relay path (AR-TRANSPORT-8, AR-COST-9)
        run: pnpm run test:relay

      # An EXPLICIT build. check:bundle measures `wrangler deploy --dry-run`,
      # which needs .svelte-kit/cloudflare/_worker.js to exist — and until now
      # that was a side effect of the E2E step's `build && preview` running
      # first in the same job. Moving E2E to the database job broke the bundle
      # check, which is a fair verdict on depending on another step's leftovers.
      - name: Build the worker
        run: pnpm run build

      - name: Bundle budget (AR-DEPLOY-3)
        run: pnpm run check:bundle


  # The database gate (AR-TEST-5/6). A SEPARATE job, not extra steps on
  # `verify`, so the fast lane still fails in seconds — starting Postgres,
  # GoTrue, and the rest costs a couple of minutes, and a lint error should
  # never wait for it.
  #
  # This is the first thing that proves AR-TEST-2's offline claim: the whole
  # stack runs locally, with no network and no hosted project.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # `db reset` applies every migration and then seed.sql, which is where the
      # pgTAP claims helper lives — it cannot live in a test file (each runs in
      # its own rolled-back transaction) or in a migration (test scaffolding in
      # production schema is how a test-only backdoor ships).
      - name: Start Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      # Behavioural, not metadata. policies_are() would pass whether the
      # anonymous policy is RESTRICTIVE or permissive — and the permissive form
      # allows anonymous room creation while looking completely correct, because
      # a permissive policy ORs with the one beside it. Only attempting the write
      # and observing the outcome can tell them apart (AR-TEST-5, TESTING.md §7).
      - name: RLS behaviour (pgTAP)
        run: supabase test db

      # The integration suite needs Node and the real local keys. pgTAP asserts
      # our ASSUMPTION about `is_anonymous`; only a real signInAnonymously()
      # proves Auth still emits it (AR-TEST-7). The keys come from the running
      # stack, not from .env.example — that file's placeholder is deliberately
      # not a working key.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Point env at the running stack
        run: |
          {
            echo "PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')"
            echo "PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '\"')"
            # Local-stack secret, not a production one: it is generated by
            # `supabase start` and never leaves the runner (AR-DEPLOY-6).
            echo "SUPABASE_SECRET_KEY=$(supabase status -o env | grep '^SECRET_KEY=' | cut -d= -f2- | tr -d '\"')"
          } > .env

      - name: Generate framework types
        run: |
          pnpm exec svelte-kit sync
          pnpm exec wrangler types

      - name: Real-JWT auth suite (AR-TEST-7)
        run: pnpm test:integration

      # E2E MOVED HERE from the fast lane. It is no longer optional whether the
      # backend is up: /new sits behind the account gate (AR-AUTH-7), and the
      # sign-in helper mints a real magic link against the local stack. Running
      # it without Supabase would not be a faster suite, it would be a red one.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Against the built worker under wrangler dev (AR-TEST-9 / AR-DEPLOY-4):
      # the only place the production runtime is exercised. Includes the axe
      # scans in both themes.
      - name: End-to-end tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Deploy is scaffolded but inert: it no-ops until the Cloudflare secrets
  # exist, so CI gates today without blocking on account setup. Add
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to
  # turn it on — no code change required. (AR-DEPLOY-2: push to main deploys;
  # PRs get previews.)
  deploy:
    # BOTH gates, not just the fast one: a red RLS suite must not ship. Naming
    # only `verify` here would have made the database job advisory.
    needs: [verify, database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check for deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Skip (no credentials configured)
        if: steps.creds.outputs.ready != 'true'
        run: |
          echo "::notice::Deploy skipped — CLOUDFLARE_API_TOKEN is not set."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository"
          echo "secrets to enable deploy-on-green (AR-DEPLOY-2)."

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run build
          pnpm exec wrangler deploy
